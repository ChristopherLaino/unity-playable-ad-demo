<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Playable Ad</title>

  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* CONTENITORE "AD" */
    #unity-container {
      width: 360px;
      height: 640px;
      background: #111;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial;
      font-size: 18px;
      opacity: 0.8;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="unity-container">

    <div id="loading">Loading...</div>

    <canvas id="unity-canvas" width="360" height="640"></canvas>

  </div>

  <script src="Build/Build.loader.js"></script>

  <script>

    createUnityInstance(document.querySelector("#unity-canvas"), {
      dataUrl: "Build/Build.data.unityweb",
      frameworkUrl: "Build/Build.framework.js.unityweb",
      codeUrl: "Build/Build.wasm.unityweb",

      companyName: "Christopher Laino",
      productName: "Playable Ad",
      productVersion: "1.0"

    }).then(() => {

      document.getElementById("loading").style.display = "none";

    }).catch((e) => {

      console.error(e);
      alert(e);

    });

  </script>

</body>
</html>
